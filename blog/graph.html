<script>
/* 必须是最先执行的脚本：声明资源根前缀（blog 页为 ".."），并在样式到达前定好主题，避免闪白。 */
window.DSH_ROOT = "..";
(function () {
    try {
        var d = document.documentElement;
        d.classList.add("js");
        var t = localStorage.getItem("dsh-theme");
        if (t !== "light" && t !== "dark") {
            t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        }
        d.setAttribute("data-theme", t);
        d.style.colorScheme = t;
    } catch (e) { /* 无 JS 环境下由 CSS 的 prefers-color-scheme 回落接管 */ }
})();
</script>
<link rel="stylesheet" href="../site-lib/styles/blog-theme.css?v=b6af1bed">
